{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="mx-auto mt-16 max-w-sm rounded-xl bg-white p-6 shadow">
  <h1 class="text-xl font-semibold">Car Scanner</h1>
  {% if error %}<p class="mt-3 rounded bg-red-50 p-2 text-sm text-red-700">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="mt-4 space-y-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="block text-sm">Username
      <input name="username" autocomplete="username" required autofocus
             class="mt-1 w-full rounded border border-slate-300 p-2">
    </label>
    <label class="block text-sm">Password
      <input name="password" type="password" autocomplete="current-password" required
             class="mt-1 w-full rounded border border-slate-300 p-2">
    </label>
    <button class="w-full rounded bg-slate-900 py-2 font-medium text-white">Log in</button>
  </form>
</div>
{% endblock %}
