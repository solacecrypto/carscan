{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="mx-auto mt-16 max-w-sm">
  <div class="mb-6 flex items-center gap-2 text-xl font-bold tracking-tight"><span class="inline-block h-7 w-7 rounded-md bg-brand-500"></span>Car Scanner</div>
  <div class="card p-6">
    {% if error %}<p class="mb-3 rounded-lg bg-bad-100 p-2 text-sm text-bad-700">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="label block">Username<input name="username" autocomplete="username" required autofocus class="input normal-case tracking-normal"></label>
      <label class="label block">Password<input name="password" type="password" autocomplete="current-password" required class="input"></label>
      <button class="btn-primary w-full py-2.5">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
