<a id="bell" href="/notifications" hx-get="/notifications/bell" hx-trigger="every 60s" hx-swap="outerHTML"
   class="relative mr-1 flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-ink-300 hover:bg-white/5 hover:text-white" title="notifications">
  <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0"/></svg>
  {% if unread %}<span class="absolute -right-0.5 -top-0.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-brand-500 px-1 text-[10px] font-bold text-ink-950">{{ unread if unread < 100 else '99+' }}</span>{% endif %}
</a>
