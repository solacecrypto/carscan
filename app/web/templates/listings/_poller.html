<div id="poller" hx-get="/listings/new-count?since={{ since|urlencode }}{{ ('&' ~ query) if query else '' }}" hx-trigger="every 60s" hx-swap="outerHTML">
  {% if count %}
  <button hx-get="/listings{{ ('?' ~ query) if query else '' }}" hx-target="#results" hx-swap="outerHTML" hx-push-url="false"
          class="btn-primary mb-4 w-full py-2.5 shadow sm:w-auto">
    {{ count }} new car{{ '' if count == 1 else 's' }} since you opened this page · show
  </button>
  {% endif %}
</div>
