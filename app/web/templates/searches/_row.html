<tr id="search-{{ s.id }}" class="border-b border-ink-100">
  <td class="py-2 pr-2"><a href="/searches/{{ s.id }}/edit" class="font-medium underline">{{ s.name }}</a>
    <div class="text-xs text-ink-400">{{ s.source }} · {{ s.role }} · every {{ s.interval_minutes }} min{% if s.role == 'deals' %} · {{ s.listings|length }} listings{% endif %}</div></td>
  <td class="py-2 pr-2">
    <button hx-post="/searches/{{ s.id }}/toggle/active" hx-target="#search-{{ s.id }}" hx-swap="outerHTML"
      class="rounded px-2 py-1 text-xs font-semibold {{ 'bg-good-100 text-good-700' if s.active else 'bg-ink-200 text-ink-600' }}">
      {{ 'active' if s.active else 'paused' }}</button></td>
  <td class="py-2">
    <button hx-post="/searches/{{ s.id }}/toggle/alerts_enabled" hx-target="#search-{{ s.id }}" hx-swap="outerHTML"
      class="rounded px-2 py-1 text-xs font-semibold {{ 'bg-sky-100 text-sky-800' if s.alerts_enabled else 'bg-ink-200 text-ink-600' }}">
      alerts {{ 'on' if s.alerts_enabled else 'off' }}</button></td>
</tr>
