[project]
name = "carscan"
version = "0.1.0"
description = "Private EU used-car import arbitrage scanner"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "selectolax>=0.3",
    "apscheduler>=3.10,<4",
    "python-telegram-bot>=21",
    "pwdlib[argon2]>=0.2",
    "typer>=0.12",
    "structlog>=24",
    "pyyaml>=6",
    "anthropic>=1.13",
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "respx>=0.21",
    "pgserver>=0.1",
]

[project.scripts]
carscan = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/insights/rules.py" = ["E501"]  # multilingual regex dictionary
"app/costs/repairs.py" = ["E501"]  # multilingual regex dictionary
"app/normalize/attrs.py" = ["E501"]  # multilingual regex dictionary

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
