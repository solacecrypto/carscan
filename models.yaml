# Watchlist: one entry per model we hunt. `carscan models sync --owner <user>` creates the
# deal searches (DE/BE/IT/SE sources) and the NL comparables searches for every entry.
# Site-specific codes come from the investigations in docs/sources/. Existing searches are
# matched by name and left alone; remove an entry and run `models sync --prune` to pause them.
models:
  - key: bmw-3er-e90
    label: "BMW E90/E91 318i/320i"
    make: BMW
    years: [2008, 2014]
    fuel: petrol
    motors: ["318i", "320i"]       # matched in titles where the site has no engine filter
    bodies: [sedan, estate]
    autoscout24:
      path: /lst/bmw/3er            # .de and .be (.be gets the /nl prefix automatically)
      cat: "ma13gr100038ge25mt102,ma13gr100038ge25mt103"
      it_path: /lst/bmw/serie-3     # .it ignores motor-type ids: filter by model number instead
      it_models: ["318", "320"]
    marktplaats:
      make_id: 96
      model: "3-Serie"
    kleinanzeigen:
      make: bmw
    automobile_it:
      path: /bmw-serie_3
    bytbil:
      make: BMW
      model: 3-serien
    sources:
      deals: [autoscout24_de, autoscout24_be, autoscout24_it, tweedehands_be, kleinanzeigen, automobile_it, bytbil]
      comparables: [autoscout24_nl, marktplaats]   # gaspedaal blocks datacenter IPs; add it back if that changes

  - key: vw-golf-6
    label: "VW Golf VI 1.2/1.4 TSI"
    make: Volkswagen
    years: [2009, 2013]
    fuel: petrol
    motors: ["1.2 TSI", "1.4 TSI"]
    bodies: []                       # hatchbacks: no body filter
    autoscout24:
      path: /lst/volkswagen/golf
      cat: "ma74gr100101ge6mt414,ma74gr100101ge6mt420,ma74gr100101ge6mt416"
      it_path: /lst/volkswagen/golf
      it_models: ["Golf"]
      it_motor_regex: true
    marktplaats: {make_id: 157, model: "Golf", query: "golf tsi"}
    kleinanzeigen: {make: volkswagen, model: golf}
    automobile_it: {path: /volkswagen-golf}
    bytbil: {make: Volkswagen, model: Golf}
    sources:
