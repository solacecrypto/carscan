# Landed-cost parameters. Edit, then run `carscan costs recompute` to apply to stored listings.
# Every amount is in whole euros unless stated otherwise. Sources and method: docs/landed_cost.md
version: 1

# Foreign currency per euro, used by the normalizer for non-EUR sources
fx:
  SEK: 11.2

transport:
  # cost to get the car from the seller to NL, per seller country (self-drive pickup assumed)
  DE: 350
  BE: 200
  IT: 900
  SE: 1100
  default: 600

fixed_fees:
  rdw_identificatie: 58.50        # RDW "Identificatie voertuig licht" (Staatscourant 2025-40185)
  rdw_inschrijving: 50.00         # RDW "Inschrijving in het kentekenregister"
  rdw_tenaamstelling: 13.10       # RDW tenaamstelling at an RDW branch
  kentekenplaten: 40.00           # two plates from a plate maker (not an RDW fee)
  recycling_bijdrage: 20.00       # Auto Recycling Nederland contribution at first registration
  export_kenteken_en_verzekering: 120.00  # German Kurzzeitkennzeichen + insurance for the drive home
  overig: 0

bpm:
  # Minimum age at which the forfaitaire table makes BPM zero (Belastingdienst): 17 years 10 months
  zero_after_months: 214
  # Forfaitaire afschrijvingstabel: rows of [from_month, base_percent, percent_per_extra_month]
  depreciation_table:
    - [0, 0, 12]
    - [1, 12, 4]
    - [3, 20, 3.5]
    - [5, 27, 1.5]
    - [9, 33, 1]
    - [18, 42, 0.75]
    - [30, 51, 0.5]
    - [42, 57, 0.42]
    - [54, 62, 0.42]
    - [66, 67, 0.42]
    - [78, 72, 0.25]
    - [90, 75, 0.25]
    - [102, 78, 0.25]
    - [114, 81, 0.19]
  # CO2-only petrol tariffs. A used import may use the most favourable tariff that applied
  # between first registration and today; the estimator takes the lowest of these.
  # brackets: [upper_g_per_km, euro_per_gram]; the last upper bound is null (= no limit)
  tariffs:
    - year: 2013
      source: Belastingdienst tarieven 2013 (confirmed)
      fixed: 0
      brackets: [[95, 0], [140, 125], [208, 148], [229, 276], [null, 551]]
    - year: 2014
      source: indexed from Kamerstuk 33007; VERIFY against Belastingdienst tarievenlijst 2014
      fixed: 0
      brackets: [[88, 0], [124, 105], [182, 126], [203, 237], [null, 474]]
    - year: 2015
      source: Belastingplan 2015 (fixed €175, 1-82 g at €6, 83-110 at €69 confirmed; higher brackets VERIFY)
      fixed: 175
      brackets: [[0, 0], [82, 6], [110, 69], [160, 112], [180, 217], [null, 434]]
  # NEDC CO2 (g/km) to assume when a listing has none, keyed by "make model" (lowercase), or gearbox-specific
  co2_fallback:
    "bmw 318i": 146
    "bmw 320i": 158
    default: 170

valuation:
  # NL value = median asking price of comparable cars (mileage-adjusted) minus a haircut
  haircut_pct: 7            # asking price -> realistic sale price
  km_rate_eur: 0.02         # value change per km of mileage difference
  min_comps: 5              # widen the windows until at least this many comparables match
  year_window: 1            # +/- registration years, first attempt
  year_window_max: 3
  mileage_window_km: 40000  # +/- km, first attempt
  mileage_window_max_km: 120000
  nearest_to_show: 8
  # Close match = same engine and gearbox (when known), and within these windows. When one
  # exists it becomes the benchmark and sets the NL value instead of the median.
  close_year_window: 1
  close_mileage_pct: 15
  close_mileage_km: 20000
  close_power_kw: 15
  close_max_deviation_pct: 30   # a match priced further from the median than this is ignored

# Rough repair costs (EUR, low/high) added to the landed cost when the ad admits a defect.
# Typical NL garage prices for a ~10-year-old car; the midpoint is used. See app/costs/repairs.py
repairs:
  not_drivable: [200, 400]  # not drivable: needs a trailer or tow
  engine_damage: [2500, 5000]  # engine damage
  injectors: [600, 1500]  # injectors
  turbo: [1000, 2000]  # turbo
  gearbox: [1500, 3500]  # gearbox
  clutch: [700, 1200]  # clutch
  timing_chain_due: [1200, 2200]  # timing chain due
  timing_belt_due: [500, 900]  # timing belt due
  head_gasket: [1200, 2500]  # head gasket
  dpf_egr: [500, 1500]  # particulate filter / EGR
  warning_light: [150, 800]  # warning light on
  ac_broken: [300, 900]  # air conditioning
  brakes: [300, 700]  # brakes
  suspension: [300, 900]  # suspension / steering parts
  steering: [400, 1000]  # power steering
  rust: [300, 1500]  # rust
  body_damage: [200, 1500]  # bodywork damage
  airbag: [300, 800]  # airbag fault
  exhaust: [200, 600]  # exhaust
  electrical: [150, 600]  # electrical fault
  battery: [100, 250]  # battery
  tyres_due: [300, 600]  # tyres
  tuv_expired: [150, 400]  # inspection expired
  oil_consumption: [300, 2000]  # oil consumption
  oil_leak: [200, 800]  # oil leak
  unspecified: [500, 1500]  # unspecified defects (seller says it needs work)
